services:
  mysql:
    image: mysql:8.4
    container_name: customer-service-mysql
    restart: always
    ports:
      - "43306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 618618
      MYSQL_DATABASE: commerce
      MYSQL_USER: zhutou
      MYSQL_PASSWORD: 618618
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ecommerce_mysql_data:/var/lib/mysql
      - ./mysql/initdb:/docker-entrypoint-initdb.d

  app:
    build:
      context: ./ecommerce-service-backend
    container_name: ecommerce-app
    restart: always
    ports:
      - "18081:18081"
    depends_on:
      - mysql
    environment:
      DATABASE_URL: "mysql+pymysql://zhutou:618618@mysql:3306/commerce?charset=utf8mb4"
      APP_PORT: 18081

volumes:
  ecommerce_mysql_data:
    name: ecommerce_mysql_data
